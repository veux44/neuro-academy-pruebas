<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel Admin | Neuro Academy</title>
    <meta name="theme-color" content="#050510">

    <!-- 🔒 Seguridad -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://unpkg.com;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data:;
        connect-src 'self' https://hrtyjewdftmijdvwycds.supabase.co;
        object-src 'none';
        base-uri 'self';
    ">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta name="robots" content="noindex, nofollow">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧠</text></svg>">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050510;
            --neon-cyan: #00e5ff;
            --neon-violet: #7c5cff;
            --neon-green: #00ff9d;
            --neon-amber: #ffb020;
            --text-primary: #eef0fb;
            --text-secondary: #b7bad6;
            --text-muted: #7c7fa0;
            --glass-bg: rgba(15, 15, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.09);
            --ease: cubic-bezier(.22,1,.36,1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Poppins', sans-serif; background-color: var(--bg-deep);
            color: var(--text-primary); min-height: 100vh; position: relative;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse 900px 700px at 15% 10%, #00e5ff14 0%, transparent 55%),
                        radial-gradient(ellipse 900px 700px at 85% 30%, #7c5cff16 0%, transparent 55%);
        }
        .topbar {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.85rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(5,5,16,0.85); backdrop-filter: blur(18px);
        }
        .topbar-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .topbar-brand .logo-icon { width: 34px; height: 34px; filter: drop-shadow(0 0 12px #00e5ff77); flex-shrink: 0; }
        .topbar-brand .brand-text {
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.15rem;
            background: linear-gradient(135deg, #fff 10%, var(--neon-cyan) 90%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .btn-logout {
            background: transparent; border: 1.5px solid rgba(255,102,102,0.4); color: #ff8888;
            padding: 0.5rem 1.1rem; border-radius: 50px; cursor: pointer; font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem; font-weight: 600; transition: all .25s;
        }
        .btn-logout:hover { background: rgba(255,68,68,0.1); border-color: #ff4444; }

        .container { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; animation: page-fade-in 0.6s cubic-bezier(.22,1,.36,1) both; }
        @keyframes page-fade-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { .container { animation: none; } }

        .welcome-block { margin-bottom: 2rem; }
        .welcome-block h1 { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.5rem; color: #fff; margin: 0 0 0.3rem; }
        .welcome-block p { color: var(--text-muted); margin: 0; font-size: 0.92rem; }

        .loading-state {
            text-align: center; padding: 3.5rem 1.5rem; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 1.4rem; color: var(--text-muted);
        }
        .panel-box {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 1.2rem; padding: 1.6rem;
        }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="topbar-brand">
            <svg class="logo-icon" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" stroke="#00e5ff" stroke-width="2.5" fill="none" opacity="0.6"/><path d="M20 30 Q30 8 40 30 Q30 52 20 30Z" stroke="#7c5cff" stroke-width="2" fill="none" opacity="0.8"/><path d="M24 30 Q30 16 36 30 Q30 44 24 30Z" stroke="#00ff9d" stroke-width="1.8" fill="none" opacity="0.7"/></svg>
            <span class="brand-text">Neuro Academy</span>
        </a>
        <button class="btn-logout" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> <span>Cerrar sesión</span></button>
    </div>

    <div class="container">
        <div class="welcome-block">
            <h1 id="welcomeText">Verificando acceso...</h1>
            <p>Panel de administración de Neuro Academy.</p>
        </div>

        <div id="contentArea">
            <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Cargando...</div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const contentArea = document.getElementById('contentArea');
        const welcomeText = document.getElementById('welcomeText');

        // Carga la librería del QR con reintento: si el primer servidor falla o tarda
        // demasiado, intenta automáticamente con un segundo servidor de respaldo.
        let qrLibraryPromise = null;
        function cargarLibreriaQR() {
            if (window.QRCode) return Promise.resolve();
            if (qrLibraryPromise) return qrLibraryPromise;

            function intentarCargar(url) {
                return new Promise((resolve, reject) => {
                    const script = document.createElement('script');
                    script.src = url;
                    const timeout = setTimeout(() => reject(new Error('timeout')), 6000);
                    script.onload = () => { clearTimeout(timeout); resolve(); };
                    script.onerror = () => { clearTimeout(timeout); reject(new Error('fallo de carga')); };
                    document.head.appendChild(script);
                });
            }

            qrLibraryPromise = intentarCargar('https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js')
                .catch(() => intentarCargar('https://unpkg.com/qrcode@1.5.3/build/qrcode.min.js'));

            return qrLibraryPromise;
        }

        async function init() {
            cargarLibreriaQR().catch(() => {}); // se empieza a cargar en segundo plano, sin bloquear nada
            // 1. Verificar sesión activa
            const { data: sessionData } = await supabaseClient.auth.getSession();
            if (!sessionData.session) {
                window.location.href = 'login.html';
                return;
            }
            const user = sessionData.session.user;

            // 2. Verificar que el rol sea admin. Si no lo es, se saca del panel
            //    sin mostrar nada de su contenido (como si la página no existiera).
            const { data: perfil, error } = await supabaseClient
                .from('perfiles')
                .select('nombre, rol')
                .eq('id', user.id)
                .single();

            if (error || !perfil || perfil.rol !== 'admin') {
                window.location.href = 'index.html';
                return;
            }

            // 3. Acceso concedido — traer la lista de cursos para el desplegable
            welcomeText.textContent = `Hola, ${perfil.nombre || user.email} 👋`;

            const { data: cursos, error: errorCursos } = await supabaseClient
                .from('cursos')
                .select('id, nombre')
                .order('nombre', { ascending: true });

            if (errorCursos || !cursos) {
                contentArea.innerHTML = `<div class="panel-box">No se pudo cargar la lista de cursos.</div>`;
                return;
            }

            const opciones = cursos.map(c => `<option value="${c.id}">${c.nombre}</option>`).join('');
            contentArea.innerHTML = `
                <div class="panel-box">
                    <p style="margin:0 0 1.4rem; color:var(--neon-green);"><i class="fa-solid fa-circle-check"></i> Acceso concedido como administrador.</p>

                    <label style="display:block; margin-bottom:0.4rem; color:var(--text-secondary); font-size:0.85rem;">Correo del alumno:</label>
                    <input type="email" id="inputCorreo" placeholder="alumno@ejemplo.com" style="width:100%; padding:0.6rem; border-radius:0.6rem; background:#0c0c1a; color:#fff; border:1px solid var(--glass-border); margin-bottom:1.2rem;">

                    <label style="display:block; margin-bottom:0.4rem; color:var(--text-secondary); font-size:0.85rem;">Curso:</label>
                    <select id="selectCurso" style="width:100%; padding:0.6rem; border-radius:0.6rem; background:#0c0c1a; color:#fff; border:1px solid var(--glass-border); margin-bottom:1.4rem;">
                        ${opciones}
                    </select>

                    <button id="btnInscribir" style="width:100%; padding:0.75rem; border-radius:0.6rem; border:none; background:linear-gradient(135deg,var(--neon-cyan),var(--neon-violet)); color:#fff; font-weight:600; cursor:pointer; font-family:'Space Grotesk',sans-serif;">
                        Inscribir alumno
                    </button>

                    <p id="resultadoInscripcion" style="margin:1rem 0 0; font-size:0.9rem;"></p>
                </div>

                <div class="panel-box" style="margin-top:1.5rem;">
                    <h2 style="font-family:'Orbitron',sans-serif; font-size:1rem; margin:0 0 1.2rem; color:#fff;"><i class="fa-solid fa-award"></i> Generar certificado</h2>

                    <label style="display:block; margin-bottom:0.4rem; color:var(--text-secondary); font-size:0.85rem;">Correo del alumno:</label>
                    <input type="email" id="inputCorreoCert" placeholder="alumno@ejemplo.com" style="width:100%; padding:0.6rem; border-radius:0.6rem; background:#0c0c1a; color:#fff; border:1px solid var(--glass-border); margin-bottom:1.2rem;">

                    <label style="display:block; margin-bottom:0.4rem; color:var(--text-secondary); font-size:0.85rem;">Curso:</label>
                    <select id="selectCursoCert" style="width:100%; padding:0.6rem; border-radius:0.6rem; background:#0c0c1a; color:#fff; border:1px solid var(--glass-border); margin-bottom:1.2rem;">
                        ${opciones}
                    </select>

                    <label style="display:block; margin-bottom:0.4rem; color:var(--text-secondary); font-size:0.85rem;">Ruta del PDF en Storage (bucket "certificados"):</label>
                    <input type="text" id="inputRutaPdfCert" placeholder="uid-del-alumno/certificado.pdf" style="width:100%; padding:0.6rem; border-radius:0.6rem; background:#0c0c1a; color:#fff; border:1px solid var(--glass-border); margin-bottom:1.4rem; font-family:monospace; font-size:0.85rem;">

                    <button id="btnGenerarCert" style="width:100%; padding:0.75rem; border-radius:0.6rem; border:none; background:var(--neon-cyan); color:#04040a; font-weight:600; cursor:pointer; font-family:'Space Grotesk',sans-serif;">
                        Generar certificado
                    </button>

                    <p id="resultadoCert" style="margin:1rem 0 0; font-size:0.9rem;"></p>

                    <div id="qrResultado" style="display:none; text-align:center; margin-top:1.2rem; padding-top:1.2rem; border-top:1px solid var(--glass-border);">
                        <p style="font-size:0.85rem; color:var(--text-secondary); margin:0 0 0.8rem;">Código: <strong id="codigoGenerado" style="color:var(--neon-green); font-family:monospace;"></strong></p>
                        <canvas id="qrCanvas" style="border-radius:0.6rem; background:#fff; padding:0.6rem;"></canvas>
                        <br>
                        <a id="btnDescargarQr" download="qr-certificado.png" style="display:inline-block; margin-top:1rem; color:var(--neon-cyan); text-decoration:underline; font-size:0.85rem; cursor:pointer;">
                            <i class="fa-solid fa-download"></i> Descargar imagen del QR
                        </a>
                    </div>
                </div>`;

            const btnInscribir = document.getElementById('btnInscribir');
            const resultadoEl = document.getElementById('resultadoInscripcion');

            btnInscribir.addEventListener('click', async () => {
                const correo = document.getElementById('inputCorreo').value.trim();
                const cursoId = document.getElementById('selectCurso').value;

                if (!correo) {
                    resultadoEl.style.color = '#ffb020';
                    resultadoEl.textContent = 'Escribe el correo del alumno.';
                    return;
                }

                btnInscribir.disabled = true;
                btnInscribir.textContent = 'Inscribiendo...';
                resultadoEl.textContent = '';

                try {
                    const { data, error } = await supabaseClient.rpc('inscribir_alumno_por_email', {
                        p_email: correo,
                        p_curso_id: cursoId
                    });

                    if (error) {
                        resultadoEl.style.color = '#ff6666';
                        resultadoEl.textContent = 'ERROR: ' + error.message;
                    } else {
                        const esOk = data.startsWith('OK');
                        resultadoEl.style.color = esOk ? 'var(--neon-green)' : (data.startsWith('AVISO') ? '#ffb020' : '#ff6666');
                        resultadoEl.textContent = data;
                        if (esOk) document.getElementById('inputCorreo').value = '';
                    }
                } catch (e) {
                    resultadoEl.style.color = '#ff6666';
                    resultadoEl.textContent = 'ERROR: no se pudo conectar con Supabase.';
                }

                btnInscribir.disabled = false;
                btnInscribir.textContent = 'Inscribir alumno';
            });

            // ==================== GENERAR CERTIFICADO ====================
            const btnGenerarCert = document.getElementById('btnGenerarCert');
            const resultadoCertEl = document.getElementById('resultadoCert');
            const qrResultadoEl = document.getElementById('qrResultado');

            btnGenerarCert.addEventListener('click', async () => {
                const correo = document.getElementById('inputCorreoCert').value.trim();
                const cursoId = document.getElementById('selectCursoCert').value;
                const rutaPdf = document.getElementById('inputRutaPdfCert').value.trim();

                if (!correo || !rutaPdf) {
                    resultadoCertEl.style.color = '#ffb020';
                    resultadoCertEl.textContent = 'Completa el correo y la ruta del PDF.';
                    return;
                }

                btnGenerarCert.disabled = true;
                btnGenerarCert.textContent = 'Generando...';
                resultadoCertEl.textContent = '';
                qrResultadoEl.style.display = 'none';

                try {
                    const { data, error } = await supabaseClient.rpc('generar_certificado', {
                        p_email: correo,
                        p_curso_id: cursoId,
                        p_ruta_pdf: rutaPdf
                    });

                    if (error) {
                        resultadoCertEl.style.color = '#ff6666';
                        resultadoCertEl.textContent = 'ERROR: ' + error.message;
                    } else if (data.startsWith('OK:')) {
                        const codigo = data.substring(3);
                        resultadoCertEl.style.color = 'var(--neon-green)';
                        resultadoCertEl.textContent = 'Certificado registrado correctamente.';

                        // Generar el QR localmente en el navegador (sin servicios externos de terceros
                        // que reciban el código; solo se descarga la librería que dibuja el QR)
                        try {
                            await cargarLibreriaQR();
                        } catch (e) {
                            resultadoCertEl.style.color = '#ffb020';
                            resultadoCertEl.textContent = 'Certificado registrado (código: ' + codigo + '), pero no se pudo generar la imagen del QR por un problema de red. Recarga la página e inténtalo de nuevo para obtener el QR.';
                            btnGenerarCert.disabled = false;
                            btnGenerarCert.textContent = 'Generar certificado';
                            return;
                        }
                        const urlVerificacion = window.location.origin + window.location.pathname.replace('admin.html', 'verificar.html') + '?codigo=' + encodeURIComponent(codigo);
                        const canvas = document.getElementById('qrCanvas');
                        await QRCode.toCanvas(canvas, urlVerificacion, { width: 220, margin: 1 });

                        document.getElementById('codigoGenerado').textContent = codigo;
                        const btnDescargarQr = document.getElementById('btnDescargarQr');
                        btnDescargarQr.href = canvas.toDataURL('image/png');
                        btnDescargarQr.download = `qr-${codigo}.png`;
                        qrResultadoEl.style.display = 'block';

                        document.getElementById('inputCorreoCert').value = '';
                        document.getElementById('inputRutaPdfCert').value = '';
                    } else {
                        resultadoCertEl.style.color = '#ff6666';
                        resultadoCertEl.textContent = data;
                    }
                } catch (e) {
                    resultadoCertEl.style.color = '#ff6666';
                    resultadoCertEl.textContent = 'ERROR: no se pudo conectar con Supabase.';
                }

                btnGenerarCert.disabled = false;
                btnGenerarCert.textContent = 'Generar certificado';
            });
        }

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        });

        init();
    </script>
</body>
</html>
