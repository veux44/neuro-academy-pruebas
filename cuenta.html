<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Cuenta | Neuro Academy</title>
    <meta name="theme-color" content="#050510">

    <!-- 🔒 Seguridad -->
    <meta http-equiv="Content-Security-Policy" content="
        default-src 'self';
        script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net;
        style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdn.jsdelivr.net https://cdnjs.cloudflare.com;
        font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com;
        img-src 'self' data:;
        connect-src 'self' https://hrtyjewdftmijdvwycds.supabase.co;
        frame-src https://www.youtube-nocookie.com;
        object-src 'none';
        base-uri 'self';
    ">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>🧠</text></svg>">

    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700;800&family=Space+Grotesk:wght@400;500;600;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-deep: #050510;
            --neon-cyan: #00e5ff;
            --neon-violet: #7c5cff;
            --neon-green: #00ff9d;
            --neon-amber: #ffb020;
            --text-primary: #eef0fb;
            --text-secondary: #b7bad6;
            --text-muted: #7c7fa0;
            --glass-bg: rgba(15, 15, 30, 0.6);
            --glass-border: rgba(255, 255, 255, 0.09);
            --ease: cubic-bezier(.22,1,.36,1);
        }
        * { box-sizing: border-box; }
        body {
            margin: 0; font-family: 'Poppins', sans-serif; background-color: var(--bg-deep);
            color: var(--text-primary); min-height: 100vh; position: relative;
        }
        body::before {
            content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0;
            background: radial-gradient(ellipse 900px 700px at 15% 10%, #00e5ff14 0%, transparent 55%),
                        radial-gradient(ellipse 900px 700px at 85% 30%, #7c5cff16 0%, transparent 55%);
        }
        .topbar {
            position: relative; z-index: 1;
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.85rem 1.5rem; border-bottom: 1px solid rgba(255,255,255,0.06);
            background: rgba(5,5,16,0.85); backdrop-filter: blur(18px);
        }
        .topbar-brand { display: flex; align-items: center; gap: 0.6rem; text-decoration: none; }
        .topbar-brand .logo-icon { width: 34px; height: 34px; filter: drop-shadow(0 0 12px #00e5ff77); animation: logo-pulse 3.4s ease-in-out infinite; flex-shrink: 0; }
        @keyframes logo-pulse { 0%,100% { filter: drop-shadow(0 0 8px #00e5ff55); } 50% { filter: drop-shadow(0 0 20px #7c5cffaa); } }
        .topbar-brand .brand-text {
            font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.15rem;
            background: linear-gradient(135deg, #fff 10%, var(--neon-cyan) 90%);
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
        }
        .btn-logout {
            background: transparent; border: 1.5px solid rgba(255,102,102,0.4); color: #ff8888;
            padding: 0.5rem 1.1rem; border-radius: 50px; cursor: pointer; font-family: 'Space Grotesk', sans-serif;
            font-size: 0.85rem; font-weight: 600; transition: all .25s;
        }
        .btn-logout:hover { background: rgba(255,68,68,0.1); border-color: #ff4444; }

        .container { position: relative; z-index: 1; max-width: 960px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; animation: page-fade-in 0.6s cubic-bezier(.22,1,.36,1) both; }
        @keyframes page-fade-in { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }
        @media (prefers-reduced-motion: reduce) { .container { animation: none; } }
        @media (max-width: 420px) {
            .topbar-brand .brand-text { font-size: 1rem; }
            .btn-logout span { display: none; }
            .btn-logout { padding: 0.5rem 0.7rem; }
        }

        .welcome-block { margin-bottom: 2rem; }
        .welcome-block h1 { font-family: 'Orbitron', sans-serif; font-weight: 700; font-size: 1.6rem; color: #fff; margin: 0 0 0.3rem; }
        .welcome-block p { color: var(--text-muted); margin: 0; font-size: 0.92rem; }

        .loading-state, .empty-state {
            text-align: center; padding: 3.5rem 1.5rem; background: var(--glass-bg); border: 1px solid var(--glass-border);
            border-radius: 1.4rem; color: var(--text-muted);
        }
        .empty-state i { font-size: 2.2rem; margin-bottom: 1rem; color: var(--text-muted); opacity: 0.5; }
        .empty-state a {
            display: inline-flex; align-items: center; gap: 0.5rem; margin-top: 1.2rem; padding: 0.65rem 1.5rem;
            background: linear-gradient(135deg, var(--neon-cyan), var(--neon-violet)); color: #04040a; border-radius: 50px;
            text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 0.88rem;
        }

        .courses-list { display: flex; flex-direction: column; gap: 1rem; }
        .my-course-card {
            background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 1.2rem;
            padding: 1.4rem 1.6rem; transition: border-color .3s;
        }
        .my-course-card:hover { border-color: rgba(0,229,255,0.35); }
        .my-course-header { display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap; margin-bottom: 0.5rem; }
        .my-course-name { font-family: 'Orbitron', sans-serif; font-weight: 600; font-size: 1.05rem; color: #fff; }
        .my-course-status { font-family: 'Space Grotesk', sans-serif; font-size: 0.72rem; font-weight: 700; color: var(--neon-green); background: rgba(0,255,157,0.1); border: 1px solid rgba(0,255,157,0.35); padding: 0.2rem 0.7rem; border-radius: 50px; }
        .my-course-desc { color: var(--text-secondary); font-size: 0.88rem; margin: 0 0 1rem; }
        .my-course-note { font-size: 0.8rem; color: var(--text-muted); background: rgba(255,255,255,0.03); border: 1px dashed rgba(255,255,255,0.12); border-radius: 0.7rem; padding: 0.7rem 0.9rem; display: flex; align-items: center; gap: 0.5rem; }
        .video-wrap { position: relative; width: 100%; padding-top: 56.25%; border-radius: 0.9rem; overflow: hidden; margin-bottom: 1rem; background: #000; }
        .video-wrap iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
        .btn-pdf {
            display: inline-flex; align-items: center; gap: 0.5rem; padding: 0.55rem 1.1rem; border-radius: 50px;
            background: rgba(255,176,32,0.1); border: 1px solid rgba(255,176,32,0.4); color: var(--neon-amber);
            text-decoration: none; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 0.85rem;
            transition: all .25s;
        }
        .btn-pdf:hover { background: rgba(255,176,32,0.18); color: var(--neon-amber); }

        .modules-list { display: flex; flex-direction: column; gap: 0.6rem; margin-top: 0.8rem; }
        .module-item { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.08); border-radius: 0.9rem; overflow: hidden; }
        .module-toggle {
            width: 100%; display: flex; align-items: center; gap: 0.8rem; padding: 0.85rem 1rem;
            background: transparent; border: none; color: #fff; cursor: pointer; text-align: left;
            font-family: 'Space Grotesk', sans-serif; font-size: 0.88rem; font-weight: 600;
        }
        .module-num {
            flex-shrink: 0; width: 26px; height: 26px; border-radius: 50%; background: rgba(0,229,255,0.12);
            border: 1px solid rgba(0,229,255,0.4); color: var(--neon-cyan); display: flex; align-items: center;
            justify-content: center; font-size: 0.75rem; font-weight: 700;
        }
        .module-title { flex-grow: 1; }
        .module-chev { color: var(--text-muted); transition: transform .3s var(--ease); flex-shrink: 0; }
        .module-toggle[aria-expanded="true"] .module-chev { transform: rotate(180deg); }
        .module-body { max-height: 0; overflow: hidden; transition: max-height .35s var(--ease); }
        .module-body-inner { padding: 0 1rem 1.1rem 3.4rem; }
        .module-desc { color: var(--text-secondary); font-size: 0.85rem; margin: 0 0 0.8rem; }
        .module-empty { font-size: 0.8rem; color: var(--text-muted); }

        .mini-footer { position: relative; z-index: 1; border-top: 1px solid rgba(255,255,255,0.06); padding: 1.6rem 1.5rem; text-align: center; margin-top: 2rem; }
        .mini-footer p { color: var(--text-muted); font-size: 0.78rem; margin: 0; }
        .mini-footer a { color: var(--text-muted); text-decoration: none; }
        .mini-footer a:hover { color: var(--neon-cyan); }
    </style>
</head>
<body>
    <div class="topbar">
        <a href="index.html" class="topbar-brand">
            <svg class="logo-icon" viewBox="0 0 60 60" aria-hidden="true"><circle cx="30" cy="30" r="28" stroke="#00e5ff" stroke-width="2.5" fill="none" opacity="0.6"/><path d="M20 30 Q30 8 40 30 Q30 52 20 30Z" stroke="#7c5cff" stroke-width="2" fill="none" opacity="0.8"/><path d="M24 30 Q30 16 36 30 Q30 44 24 30Z" stroke="#00ff9d" stroke-width="1.8" fill="none" opacity="0.7"/></svg>
            <span class="brand-text">Neuro Academy</span>
        </a>
        <button class="btn-logout" id="btnLogout"><i class="fa-solid fa-right-from-bracket"></i> <span>Cerrar sesión</span></button>
    </div>

    <div class="container">
        <div class="welcome-block">
            <h1 id="welcomeText">Cargando tu cuenta...</h1>
            <p>Aquí encuentras todos los cursos en los que estás inscrito.</p>
        </div>

        <div id="contentArea">
            <div class="loading-state"><i class="fa-solid fa-spinner fa-spin"></i> Cargando tus cursos...</div>
        </div>
    </div>

    <footer class="mini-footer">
        <p>© 2026 Neuro Academy · <a href="index.html">neuroacademy.com.ec</a></p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js"></script>
    <script>
        const contentArea = document.getElementById('contentArea');
        const welcomeText = document.getElementById('welcomeText');

        function escapeHTML(str) { const d = document.createElement('div'); d.textContent = str ?? ''; return d.innerHTML; }

        // Genera un link temporal y seguro para un PDF, respetando las reglas de acceso (RLS).
        // Si el usuario no tiene permiso (no está inscrito en ese curso), Supabase devuelve error y no se genera el link.
        async function generarLinkPDF(ruta, bucket = 'pdfs-cursos') {
            if (!ruta) return null;
            const { data, error } = await supabaseClient
                .storage
                .from(bucket)
                .createSignedUrl(ruta, 3600); // válido por 1 hora
            if (error) return null;
            return data.signedUrl;
        }

        async function init() {
            // 1. Verificar sesión activa
            const { data: sessionData } = await supabaseClient.auth.getSession();
            if (!sessionData.session) {
                window.location.href = 'login.html';
                return;
            }
            const user = sessionData.session.user;

            // 2. Traer el perfil (nombre, rol)
            const { data: perfil } = await supabaseClient
                .from('perfiles')
                .select('nombre, rol')
                .eq('id', user.id)
                .single();

            welcomeText.textContent = `Hola, ${perfil?.nombre || user.email} 👋`;

            // 3. Traer los cursos inscritos de este alumno
            const { data: inscripciones, error } = await supabaseClient
                .from('inscripciones')
                .select('id, cursos (id, nombre, descripcion, pdf_temario_url, link_clase)')
                .eq('alumno_id', user.id);

            if (error) {
                contentArea.innerHTML = `<div class="loading-state">No se pudo cargar tu información. Intenta recargar la página.</div>`;
                return;
            }

            if (!inscripciones || inscripciones.length === 0) {
                contentArea.innerHTML = `
                    <div class="empty-state">
                        <i class="fa-solid fa-book-open"></i>
                        <p>Todavía no tienes cursos activos en tu cuenta.</p>
                        <a href="index.html#cursos"><i class="fa-solid fa-graduation-cap"></i> Ver cursos disponibles</a>
                    </div>`;
                return;
            }

            // 4. Traer los módulos de todos esos cursos, ordenados
            const cursoIds = inscripciones.map(insc => insc.cursos?.id).filter(Boolean);
            const { data: modulos } = await supabaseClient
                .from('modulos')
                .select('id, curso_id, orden, titulo, descripcion, video_youtube_id, pdf_url')
                .in('curso_id', cursoIds)
                .order('orden', { ascending: true });

            // 4b. Traer los certificados que este alumno ya tiene (RLS solo permite ver los propios)
            const { data: certificados } = await supabaseClient
                .from('certificados')
                .select('curso_id, ruta_pdf')
                .eq('alumno_id', user.id);

            contentArea.innerHTML = `<div class="courses-list">${inscripciones.map(insc => {
                const curso = insc.cursos;
                const modulosDelCurso = (modulos || []).filter(m => m.curso_id === curso?.id);
                const certificadoDelCurso = (certificados || []).find(c => c.curso_id === curso?.id);

                const modulosHTML = modulosDelCurso.length > 0
                    ? `<div class="modules-list">${modulosDelCurso.map((mod, i) => {
                        const videoHTML = mod.video_youtube_id
                            ? `<div class="video-wrap"><iframe src="https://www.youtube-nocookie.com/embed/${encodeURIComponent(mod.video_youtube_id)}" title="Video del módulo" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`
                            : '';
                        const pdfHTML = mod.pdf_url
                            ? `<a href="#" data-pdf-path="${escapeHTML(mod.pdf_url)}" class="btn-pdf pdf-pending"><i class="fa-solid fa-spinner fa-spin"></i> Preparando PDF...</a>`
                            : '';
                        const vacioHTML = (!mod.video_youtube_id && !mod.pdf_url)
                            ? `<p class="module-empty"><i class="fa-solid fa-circle-info"></i> El material de este módulo se publicará pronto.</p>` : '';
                        return `
                        <div class="module-item">
                            <button class="module-toggle" aria-expanded="false" data-module-id="mod-${mod.id}">
                                <span class="module-num">${mod.orden}</span>
                                <span class="module-title">${escapeHTML(mod.titulo)}</span>
                                <i class="fa-solid fa-chevron-down module-chev"></i>
                            </button>
                            <div class="module-body" id="mod-${mod.id}">
                                <div class="module-body-inner">
                                    ${mod.descripcion ? `<p class="module-desc">${escapeHTML(mod.descripcion)}</p>` : ''}
                                    ${videoHTML}
                                    ${pdfHTML}
                                    ${vacioHTML}
                                </div>
                            </div>
                        </div>`;
                    }).join('')}</div>`
                    : `<div class="my-course-note"><i class="fa-solid fa-circle-info"></i> El contenido de este curso se publicará muy pronto.</div>`;

                return `
                <div class="my-course-card">
                    <div class="my-course-header">
                        <span class="my-course-name">${escapeHTML(curso?.nombre)}</span>
                        <span class="my-course-status"><i class="fa-solid fa-circle-check"></i> Activo</span>
                    </div>
                    <p class="my-course-desc">${escapeHTML(curso?.descripcion)}</p>
                    ${curso?.link_clase ? `<a href="${escapeHTML(curso.link_clase)}" target="_blank" rel="noopener noreferrer" class="btn-pdf" style="margin-bottom:1rem; background:var(--neon-cyan); color:#04040a; border-color:var(--neon-cyan);"><i class="fa-solid fa-video"></i> Unirse a la clase en vivo</a>` : ''}
                    ${certificadoDelCurso ? `<a href="#" data-cert-path="${escapeHTML(certificadoDelCurso.ruta_pdf)}" class="btn-pdf cert-pending" style="margin-bottom:1rem;"><i class="fa-solid fa-spinner fa-spin"></i> Preparando certificado...</a>` : ''}
                    ${curso?.pdf_temario_url ? `<a href="#" data-pdf-path="${escapeHTML(curso.pdf_temario_url)}" class="btn-pdf pdf-pending" style="margin-bottom:1rem;"><i class="fa-solid fa-spinner fa-spin"></i> Preparando temario...</a>` : ''}
                    ${modulosHTML}
                </div>`;
            }).join('')}</div>`;

            // 5. Activar el acordeón de módulos
            document.querySelectorAll('.module-toggle').forEach(btn => {
                btn.addEventListener('click', () => {
                    const expanded = btn.getAttribute('aria-expanded') === 'true';
                    const body = document.getElementById(btn.dataset.moduleId);
                    btn.setAttribute('aria-expanded', String(!expanded));
                    body.style.maxHeight = expanded ? '0px' : body.scrollHeight + 'px';
                });
            });

            // 6. Generar los links reales y seguros de cada PDF (respetando las reglas de acceso)
            document.querySelectorAll('.pdf-pending').forEach(async (link) => {
                const ruta = link.dataset.pdfPath;
                const url = await generarLinkPDF(ruta);
                if (url) {
                    link.href = url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.classList.remove('pdf-pending');
                    link.innerHTML = '<i class="fa-solid fa-file-pdf"></i> Ver PDF';
                } else {
                    link.classList.remove('pdf-pending');
                    link.innerHTML = '<i class="fa-solid fa-lock"></i> No disponible';
                    link.style.opacity = '0.5';
                    link.style.pointerEvents = 'none';
                }
            });

            // 7. Generar el link real y seguro del certificado (bucket privado "certificados")
            document.querySelectorAll('.cert-pending').forEach(async (link) => {
                const ruta = link.dataset.certPath;
                const url = await generarLinkPDF(ruta, 'certificados');
                if (url) {
                    link.href = url;
                    link.target = '_blank';
                    link.rel = 'noopener noreferrer';
                    link.classList.remove('cert-pending');
                    link.innerHTML = '<i class="fa-solid fa-award"></i> Descargar certificado';
                } else {
                    link.classList.remove('cert-pending');
                    link.innerHTML = '<i class="fa-solid fa-lock"></i> No disponible';
                    link.style.opacity = '0.5';
                    link.style.pointerEvents = 'none';
                }
            });
        }

        document.getElementById('btnLogout').addEventListener('click', async () => {
            await supabaseClient.auth.signOut();
            window.location.href = 'login.html';
        });

        init();
    </script>
</body>
</html>
